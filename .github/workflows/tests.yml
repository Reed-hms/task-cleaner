name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 只挑「该镜像确实提供该 Python」的组合，避免 setup-python 阶段就红。
        # ubuntu-latest 已是 26.04，早于 3.11 的版本都不再预置；Windows 仍可装 3.8，
        # 用它守住 README 承诺的最低版本。macos-13 已退役，不再使用。
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter and real path
        run: python -c "import sys, os; print(sys.version); print(sys.platform); print('cwd realpath:', os.path.realpath(os.getcwd()))"
      - name: Run tests
        run: python scripts/test_registry.py -v
